<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELIP</title>
  </head>
  <body class="
  [:where(&)_*]:box-border mt-0 mr-0 mb-0 ml-0 min-w-0 bg-slate-100 text-slate-800
  font-sans [:where(&)_button]:cursor-pointer
  max-lg:[&_button]:min-h-11! max-lg:[&_button]:min-w-11!
  max-lg:[&_input:not([type=checkbox])]:min-h-11! max-lg:[&_input:not([type=checkbox])]:text-base!
  max-lg:[&_select]:min-h-11! max-lg:[&_select]:text-base! max-lg:[&_select]:max-w-full!
  max-lg:[&_textarea]:text-base!
  max-lg:[&_label:has(input)]:min-h-11! max-lg:[&_label:has(select)]:min-h-11!
  [:where(&)_kbd]:pt-0.5!
  [:where(&)_kbd]:pr-1.25! [:where(&)_kbd]:pb-0.5! [:where(&)_kbd]:pl-1.25!
  [:where(&)_kbd]:rounded-sm! [:where(&)_kbd]:text-slate-400! [:where(&)_kbd]:bg-white!
  [:where(&)_kbd]:font-normal! [:where(&)_kbd]:text-micro! max-lg:[:where(&)_kbd]:text-xs! [:where(&)_kbd]:leading-default!
  [:where(&)_kbd]:font-sans! [:where(&)_kbd]:not-italic! [:where(&)_kbd]:border!
  [:where(&)_kbd]:border-solid! [:where(&)_kbd]:border-slate-200! [:where(&)_h1]:mt-2.25!
  [:where(&)_h1]:mr-0! [:where(&)_h1]:mb-1! [:where(&)_h1]:ml-0! [:where(&)_h1]:text-slate-800!
  [:where(&)_h1]:font-bold! [:where(&)_h1]:text-display! [:where(&)_h1]:leading-title!
  [:where(&)_h1]:font-sans! [:where(&)_h1]:not-italic! [:where(&)_h1]:tracking-title!
  max-lg:[:where(&)_main]:w-full! max-lg:[:where(&)_main]:ml-0!
  [:where(&)_button:focus-visible]:outline-2! [:where(&)_button:focus-visible]:outline-blue-500!
  [:where(&)_button:focus-visible]:outline-offset-2!
  [:where(&)_a:focus-visible]:outline-2! [:where(&)_a:focus-visible]:outline-blue-500!
  [:where(&)_a:focus-visible]:outline-offset-2!
  [:where(&)_input:focus-visible]:outline-2! [:where(&)_input:focus-visible]:outline-blue-500!
  [:where(&)_input:focus-visible]:outline-offset-2!
  [:where(&)_select:focus-visible]:outline-2! [:where(&)_select:focus-visible]:outline-blue-500!
  [:where(&)_select:focus-visible]:outline-offset-2!
  [:where(&)_textarea:focus-visible]:outline-2! [:where(&)_textarea:focus-visible]:outline-blue-500!
  [:where(&)_textarea:focus-visible]:outline-offset-2!
">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
