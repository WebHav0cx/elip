[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electoral-logistics-backend"
version = "0.1.0"
description = "Backend services for the Electoral Logistics Intelligence Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.14.1",
    "fastapi==0.115.6",
    "geoalchemy2==0.17.1",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.7.1",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]==0.34.0",
    "joblib==1.4.2",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
    "ruff==0.9.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
