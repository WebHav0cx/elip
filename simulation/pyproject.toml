[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electoral-logistics-simulation"
version = "0.1.0"
description = "Reproducible synthetic logistics data and event simulation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "pyyaml==6.0.2",
    "scikit-learn==1.6.1",
    "joblib==1.4.2",
    "pandas==2.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
include = ["simulation*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
